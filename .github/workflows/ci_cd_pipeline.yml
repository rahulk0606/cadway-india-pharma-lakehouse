name: Cadway India Pharma Lakehouse CI/CD

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Run Flake8 Linter
        run: flake8 src/ tests/ data_generator/ --max-line-length=120 --ignore=E501,W503
      - name: Run PySpark Unit & SCD2 Tests
        env:
          PYTHONPATH: .
        run: pytest tests/ -v
